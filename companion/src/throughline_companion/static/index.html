<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Throughline Companion</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#ffffff; --panel-2:#fbfbfc; --ink:#1b1f24; --ink-2:#5b636d;
    --ink-3:#848d98; --line:#e2e5ea; --line-2:#d4d8df; --accent:#2f6fed; --accent-ink:#ffffff;
    --ok:#1a8a4f; --ok-bg:#e4f4ea; --warn:#9a6a00; --warn-bg:#fbefd6; --bad:#c0392b; --bad-bg:#fbe6e3;
    --idle:#6b737e; --idle-bg:#eceef1; --focus:#2f6fed; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    --chip:#eef1f6; --chip-ink:#374151; --shadow:0 1px 2px rgba(20,24,30,.06),0 1px 1px rgba(20,24,30,.04);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#121418; --panel:#1b1e23; --panel-2:#191c21; --ink:#e7eaef; --ink-2:#a3abb6; --ink-3:#79818c;
      --line:#2a2e35; --line-2:#363b43; --accent:#5a8cf5; --accent-ink:#0b0e12;
      --ok:#51c07f; --ok-bg:#15311f; --warn:#e0b85a; --warn-bg:#352a12; --bad:#ef7a6f; --bad-bg:#371c19;
      --idle:#8b939e; --idle-bg:#262a31; --chip:#262a31; --chip-ink:#c4ccd6; --shadow:0 1px 2px rgba(0,0,0,.3);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
  }
  a{color:var(--accent)}
  code,kbd{font-family:var(--mono); font-size:.92em; background:var(--panel-2); padding:1px 4px; border-radius:4px; border:1px solid var(--line)}
  button{font:inherit; cursor:pointer}
  :focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:4px}
  .wrap{max-width:980px; margin:0 auto; padding:0 16px 48px}

  /* Header */
  header.topbar{
    position:sticky; top:0; z-index:20; background:var(--panel); border-bottom:1px solid var(--line);
    box-shadow:var(--shadow);
  }
  .topbar-in{max-width:980px; margin:0 auto; padding:10px 16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap}
  .brand{display:flex; flex-direction:column; min-width:0}
  .brand b{font-size:15px; letter-spacing:.2px}
  .brand small{color:var(--ink-2); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:60vw}
  .topbar-right{margin-left:auto; display:flex; gap:14px; align-items:center; flex-wrap:wrap}
  .topbar-toggle{display:flex; gap:7px; align-items:center; font-size:12px; color:var(--ink-2)}

  /* Status pill */
  .pill{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:3px 9px; border-radius:999px; border:1px solid transparent; white-space:nowrap}
  .pill .dot{width:8px; height:8px; border-radius:999px; background:currentColor; flex:none}
  .pill.ok{color:var(--ok); background:var(--ok-bg)}
  .pill.warn{color:var(--warn); background:var(--warn-bg)}
  .pill.bad{color:var(--bad); background:var(--bad-bg)}
  .pill.idle{color:var(--idle); background:var(--idle-bg)}

  /* Sections */
  section{margin-top:22px; scroll-margin-top:76px}
  .plugin{scroll-margin-top:76px}
  .sec-head{display:flex; align-items:baseline; gap:10px; margin:0 0 10px}
  .sec-head h2{font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-2); margin:0; font-weight:700}
  .sec-head .hint{font-size:12px; color:var(--ink-3)}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow)}
  .card + .card{margin-top:10px}
  .card-pad{padding:14px 16px}
  .muted{color:var(--ink-2)}
  .tiny{font-size:12px}
  .mono{font-family:var(--mono)}

  /* Forms */
  label{font-weight:600; font-size:12.5px}
  .field{display:flex; flex-direction:column; gap:4px; margin-bottom:12px}
  .field .desc{font-weight:400; color:var(--ink-2); font-size:12px}
  input[type=text],input[type=password],input[type=number],input[type=url],textarea,select{
    width:100%; font:inherit; color:var(--ink); background:var(--panel-2); border:1px solid var(--line-2);
    border-radius:7px; padding:8px 9px;
  }
  input::placeholder,textarea::placeholder{color:var(--ink-3)}
  textarea{resize:vertical; min-height:90px; font-family:var(--mono); font-size:13px}
  input[type=number]{max-width:140px}
  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
  .grow{flex:1 1 auto; min-width:0}

  .btn{
    display:inline-flex; align-items:center; gap:6px; background:var(--panel-2); color:var(--ink);
    border:1px solid var(--line-2); border-radius:7px; padding:7px 12px; font-size:13px; font-weight:600;
  }
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
  .btn.primary:hover{filter:brightness(1.05)}
  .btn.danger{color:var(--bad); border-color:var(--line-2)}
  .btn.danger:hover{border-color:var(--bad)}
  .btn.small{padding:4px 9px; font-size:12px}
  .btn:disabled{opacity:.5; cursor:not-allowed}

  /* Switch */
  .switch{position:relative; display:inline-flex; align-items:center; flex:none}
  .switch input{position:absolute; opacity:0; width:38px; height:22px; margin:0; cursor:pointer}
  .switch .track{width:38px; height:22px; border-radius:999px; background:var(--line-2); transition:background .12s; flex:none; display:inline-block; position:relative}
  .switch .track::after{content:""; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:999px; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.3); transition:transform .12s}
  .switch input:checked + .track{background:var(--accent)}
  .switch input:checked + .track::after{transform:translateX(16px)}
  .switch input:focus-visible + .track{outline:2px solid var(--focus); outline-offset:2px}
  .switch input:disabled + .track{opacity:.5}

  /* Segmented */
  .seg{display:inline-flex; align-self:flex-start; max-width:100%; border:1px solid var(--line-2); border-radius:8px; overflow:hidden; background:var(--panel-2)}
  .seg button{background:transparent; border:0; padding:7px 12px; font-size:13px; font-weight:600; color:var(--ink-2); border-right:1px solid var(--line-2)}
  .seg button:last-child{border-right:0}
  .seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}

  /* Badges */
  .badges{display:flex; gap:6px; flex-wrap:wrap}
  .badge{font-size:11px; font-weight:600; padding:2px 7px; border-radius:6px; border:1px solid var(--line-2); color:var(--ink-2); background:var(--panel-2); white-space:nowrap}
  .badge.ok{color:var(--ok); border-color:transparent; background:var(--ok-bg)}
  .badge.warn{color:var(--warn); border-color:transparent; background:var(--warn-bg)}
  .badge.bad{color:var(--bad); border-color:transparent; background:var(--bad-bg)}

  /* Chips */
  .chips{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
  .chip{display:inline-flex; align-items:center; gap:5px; background:var(--chip); color:var(--chip-ink); font-size:12px; font-weight:600; padding:3px 4px 3px 9px; border-radius:999px}
  .chip button{background:transparent; border:0; color:inherit; font-size:14px; line-height:1; padding:0 3px; border-radius:999px; opacity:.7}
  .chip button:hover{opacity:1}
  .chips input.chip-input{border:0; background:transparent; min-width:90px; flex:1 1 90px; width:auto; padding:4px 2px; border-radius:0}
  .chips input.chip-input:focus-visible{outline:none}
  .chips:focus-within{border-color:var(--focus) !important}

  /* Plugin rows */
  .plugin{border-bottom:1px solid var(--line)}
  .plugin:last-child{border-bottom:0}
  .plugin-main{display:flex; gap:12px; align-items:flex-start; padding:12px 16px}
  .plugin-info{min-width:0; flex:1 1 auto}
  .plugin-info .title{font-weight:700; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
  .plugin-info .summary{color:var(--ink-2); font-size:12.5px; margin-top:2px}
  .plugin-meta{margin-top:7px; display:flex; gap:12px; flex-wrap:wrap; font-size:12px; color:var(--ink-2)}
  .plugin-actions{display:flex; gap:8px; align-items:center; flex:none}
  .err{font-family:var(--mono); font-size:12px; color:var(--bad); background:var(--bad-bg); border-radius:6px; padding:6px 8px; margin-top:7px; white-space:pre-wrap; word-break:break-word}
  .err.clip{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  details.err-d{margin-top:7px}
  details.err-d > summary{cursor:pointer; color:var(--bad); font-size:12px; font-weight:600; list-style:none}
  details.err-d > summary::-webkit-details-marker{display:none}
  .panel-settings{padding:0 16px 16px; border-top:1px dashed var(--line); background:var(--panel-2)}
  .panel-settings .pad{padding-top:14px}
  .two{display:grid; grid-template-columns:1fr 1fr; gap:0 16px}
  @media (max-width:560px){ .two{grid-template-columns:1fr} header.topbar{position:static} section,.plugin{scroll-margin-top:0} }

  .cap{border-bottom:1px solid var(--line)}
  .cap:last-child{border-bottom:0}
  .cap-head{display:flex; gap:12px; align-items:flex-start; padding:12px 16px}
  .cap-body{padding:0 16px 16px}
  .inline-err{color:var(--bad); background:var(--bad-bg); font-size:12px; padding:6px 8px; border-radius:6px; margin-top:8px}
  .list-ed .item{display:flex; gap:8px; align-items:center; margin-bottom:6px}
  .browsers{display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:6px 12px}
  .cb{display:flex; gap:7px; align-items:center; font-weight:500; font-size:13px}
  .stat{font-size:12px; color:var(--ink-2)}

  /* Modal */
  .overlay{position:fixed; inset:0; background:rgba(10,12,16,.5); display:flex; align-items:stretch; justify-content:center; z-index:50; padding:4vh 16px}
  .modal{background:var(--panel); border:1px solid var(--line); border-radius:12px; box-shadow:0 12px 40px rgba(0,0,0,.35); width:100%; max-width:760px; display:flex; flex-direction:column; max-height:92vh}
  .modal-head{display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--line)}
  .modal-head b{flex:1}
  .modal-body{overflow:auto; padding:0}
  pre.log{margin:0; padding:14px 16px; font-family:var(--mono); font-size:12.5px; line-height:1.5; white-space:pre-wrap; word-break:break-word; color:var(--ink)}

  .full-msg{max-width:520px; margin:12vh auto; text-align:center; padding:0 16px}
  .full-msg .card-pad{text-align:left}
  footer{margin-top:30px; padding-top:16px; border-top:1px solid var(--line); color:var(--ink-3); font-size:12px; display:flex; gap:14px; flex-wrap:wrap}
  .toast{position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:9px 14px; border-radius:8px; font-size:13px; z-index:60; box-shadow:0 6px 20px rgba(0,0,0,.3); max-width:92vw}
  .toast.bad{background:var(--bad); color:#fff}
  .sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
  .spin{display:inline-block; width:12px; height:12px; border:2px solid currentColor; border-top-color:transparent; border-radius:999px; animation:sp .7s linear infinite; vertical-align:-1px}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){ .spin{animation:none} *{transition:none !important} }
</style>
</head>
<body>
<header class="topbar"><div class="topbar-in" id="topbar"></div></header>
<main class="wrap" id="app"><div class="card" style="margin-top:22px"><div class="card-pad muted">Loading Throughline Companion...</div></div></main>
<div id="modal-root"></div>
<div id="toast-root" aria-live="assertive"></div>

<script>
"use strict";
(function(){
  /* ---------- small DOM helper (text is always escaped via textContent) ---------- */
  function el(tag, props){
    const n = document.createElement(tag);
    if(props){
      for(const k in props){
        const v = props[k];
        if(v == null || v === false) continue;
        if(k === "class") n.className = v;
        else if(k === "text") n.textContent = v;
        else if(k === "for") n.htmlFor = v;
        else if(k === "value") n.value = v;
        else if(k === "checked") n.checked = !!v;
        else if(k === "disabled") n.disabled = !!v;
        else if(k === "html") { /* intentionally unsupported */ }
        else if(k.slice(0,2) === "on" && typeof v === "function") n.addEventListener(k.slice(2).toLowerCase(), v);
        else if(v === true) n.setAttribute(k, "");
        else n.setAttribute(k, v);
      }
    }
    for(let i=2;i<arguments.length;i++) append(n, arguments[i]);
    return n;
  }
  function append(n, kid){
    if(kid == null || kid === false) return;
    if(Array.isArray(kid)){ kid.forEach(function(k){ append(n,k); }); return; }
    n.appendChild(typeof kid === "object" ? kid : document.createTextNode(String(kid)));
  }

  /* ---------- state ---------- */
  var state = null, lastJSON = "", unauthorized = false;
  var ui = {
    expanded: {},          // plugin name -> true (settings panel open)
    manifests: {},         // plugin name -> manifest | {error}
    errOpen: {},           // "plugin:name" -> true
    showUnsupported: false,
    pairError: "", pairBusy: false, pairResult: null,
    capErr: {},            // capability -> error string
    captureTest: null,     // last /api/capture/test-screen result
    captureLocalOpen: null,// on-device models <details> open override
    captureAudioAdvOpen: null, // advanced audio <details> open override
    infisicalOpen: false,  // Infisical settings card expanded
    infisicalTest: null,   // last /api/infisical/test result or {error}
    infisicalSecrets: null,// cached list of {key, path, environment, ref} (names only)
    infisicalLoading: false,
    secretMode: {},        // "plugin:ENV" -> "direct" | "infisical"
    modal: null            // {title, text} for log
  };

  /* ---------- api ---------- */
  function api(method, path, body){
    var opts = { method: method, credentials: "same-origin", headers: {} };
    if(body !== undefined){ opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
    return fetch(path, opts).then(function(res){
      if(res.status === 401){ unauthorized = true; render(); throw { status:401, error:"unauthorized" }; }
      return res.text().then(function(t){
        var data = null; try{ data = t ? JSON.parse(t) : null; }catch(e){}
        if(!res.ok){ throw { status:res.status, error:(data && data.error) || ("Request failed ("+res.status+")") }; }
        return data;
      });
    });
  }
  function toast(msg, kind){
    var r = document.getElementById("toast-root"); r.textContent = "";
    var t = el("div",{class:"toast" + (kind === "bad" ? " bad" : ""),role:"status"}, msg);
    r.appendChild(t);
    setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 4200);
  }

  function refresh(){
    return api("GET","/api/state").then(function(s){
      unauthorized = false; applyState(s);
    }).catch(function(e){ if(e && e.status === 401) return; /* keep last state */ });
  }
  function applyState(s){
    state = s;
    var j = JSON.stringify(s);
    if(j !== lastJSON){ lastJSON = j; render(); }
  }
  // Mutating action: call api, then refresh and re-render regardless.
  function act(p){
    return p.then(function(){ return refresh().then(function(){ return true; }); }).catch(function(e){
      if(e && e.status === 401) return false;
      toast((e && e.error) ? e.error : "Something went wrong", "bad");
      return refresh().then(function(){ return false; });
    });
  }

  /* ---------- time helpers ---------- */
  function toUnix(t){
    if(t == null || t === "") return null;
    if(typeof t === "number") return t;
    var n = Number(t);
    if(!isNaN(n)) return n;
    var ms = Date.parse(t);
    return isNaN(ms) ? null : ms/1000;
  }
  function relTime(t){
    var unix = toUnix(t);
    if(unix == null) return "never";
    var d = Math.floor(Date.now()/1000 - unix);
    var future = d < 0; d = Math.abs(d);
    var s;
    if(d < 5) s = "just now";
    else if(d < 60) s = d + "s";
    else if(d < 3600) s = Math.floor(d/60) + "m";
    else if(d < 86400) s = Math.floor(d/3600) + "h";
    else s = Math.floor(d/86400) + "d";
    if(s === "just now") return s;
    return future ? ("in " + s) : (s + " ago");
  }
  // A span whose relative time is refreshed on every poll, without a re-render.
  function timeSpan(prefix, t){
    var u = toUnix(t);
    var title = u != null ? new Date(u*1000).toLocaleString() : null;
    return el("span",{"data-prefix":prefix,"data-ts":(u != null ? String(u) : ""),title:title}, prefix + relTime(u));
  }
  function refreshTimes(){
    document.querySelectorAll("[data-ts]").forEach(function(n){
      var u = n.getAttribute("data-ts");
      n.textContent = n.getAttribute("data-prefix") + relTime(u === "" ? null : Number(u));
    });
  }
  function fmtInterval(s){
    if(s == null) return "";
    if(s >= 3600 && s % 3600 === 0) return (s/3600) + " h";
    if(s >= 60 && s % 60 === 0) return (s/60) + " min";
    return s + "s";
  }

  /* ---------- editing guard (pause polling while typing) ---------- */
  function isEditingField(){
    var a = document.activeElement;
    if(!a) return false;
    if(a.tagName === "TEXTAREA") return true;
    if(a.tagName === "INPUT"){
      var t = (a.getAttribute("type") || "text").toLowerCase();
      return ["checkbox","radio","button","submit","reset","range"].indexOf(t) === -1;
    }
    return false;
  }

  /* =========================================================
     RENDER
     ========================================================= */
  function render(){
    var keep = captureView();
    renderTopbar();
    var app = document.getElementById("app");
    app.textContent = "";
    try{ renderBody(app); } finally { restoreView(keep); }
  }
  // Values typed but not yet saved, by element id; re-applied after each re-render.
  var drafts = {};
  document.addEventListener("input",function(e){
    var t = e.target;
    if(t && t.id && (t.tagName === "INPUT" || t.tagName === "TEXTAREA") && t.type !== "checkbox" && t.type !== "radio") drafts[t.id] = t.value;
  });
  function clearDrafts(prefix){ Object.keys(drafts).forEach(function(k){ if(k.indexOf(prefix) === 0) delete drafts[k]; }); }
  function captureView(){
    var a = document.activeElement, v = { x:window.scrollX, y:window.scrollY, id:null };
    if(a && a.id && document.getElementById("app").contains(a)){
      v.id = a.id;
      try{ v.start = a.selectionStart; v.end = a.selectionEnd; }catch(e){}
    }
    return v;
  }
  function restoreView(v){
    Object.keys(drafts).forEach(function(id){
      var n = document.getElementById(id);
      if(n && n.value !== drafts[id]) n.value = drafts[id];
    });
    if(v.id){
      var n = document.getElementById(v.id);
      if(n){
        n.focus({preventScroll:true});
        try{ if(v.start != null) n.setSelectionRange(v.start, v.end); }catch(e){}
      }
    }
    window.scrollTo(v.x, v.y);
  }
  function renderBody(app){
    if(unauthorized){ app.appendChild(view401()); renderModal(); return; }
    if(!state){ app.appendChild(el("div",{class:"card",style:"margin-top:22px"}, el("div",{class:"card-pad muted"},"Loading..."))); return; }

    if(!state.paired) app.appendChild(sectionPairing());
    app.appendChild(sectionConnectors());
    app.appendChild(sectionActivityWatch());
    app.appendChild(sectionCapture());
    app.appendChild(sectionBridge());
    app.appendChild(sectionInfisical());
    var jobsSec = sectionJobs(); if(jobsSec) app.appendChild(jobsSec);
    if(state.paired) app.appendChild(sectionDeviceSettings());
    app.appendChild(footer());
    renderModal();
  }

  function view401(){
    return el("div",{class:"full-msg"},
      el("div",{class:"card"}, el("div",{class:"card-pad"},
        el("h2",{style:"margin:0 0 8px"},"Not signed in"),
        el("p",{class:"muted",style:"margin:0 0 10px"},"This dashboard needs the companion session cookie."),
        el("p",{style:"margin:0"}, "Open the dashboard from the tray icon or run ", el("code",{},"throughline-companion open"), ".")
      ))
    );
  }

  /* ---------- Header ---------- */
  function bridgePill(){
    var b = state.bridge || {};
    var map = {
      connected:["ok","Bridge connected"], offline:["idle","Bridge offline"],
      refused:["bad","Bridge refused"], error:["bad","Bridge error"],
      not_paired:["warn","Bridge: not paired"], off:["idle","Bridge off"], stopped:["idle","Bridge stopped"]
    };
    var m = map[b.state] || ["idle","Bridge: " + (b.state || "unknown")];
    return el("span",{class:"pill "+m[0], title:(b.last_error||"")}, el("span",{class:"dot"}), m[1]);
  }
  function renderTopbar(){
    var bar = document.getElementById("topbar");
    bar.textContent = "";
    var brand = el("div",{class:"brand"}, el("b",{},"Throughline Companion"));
    if(state && state.paired && state.server){
      brand.appendChild(el("small",{title:(state.server.device||"")+" - "+(state.server.url||"")},
        (state.server.device || "device") + "  -  " + (state.server.url || "")));
    } else if(state){
      brand.appendChild(el("small",{}, state.paired ? "" : "Not paired"));
    }
    bar.appendChild(brand);

    var right = el("div",{class:"topbar-right"});
    if(state && !unauthorized){
      right.appendChild(bridgePill());
      right.appendChild(toggleControl("Pause all", !!state.paused, function(v){
        act(api("POST","/api/pause",{paused:v}));
      }, "pause-all"));
      right.appendChild(toggleControl("Start at login", !!state.autostart, function(v){
        act(api("POST","/api/autostart",{enabled:v}));
      }, "autostart"));
    }
    bar.appendChild(right);
  }
  function toggleControl(labelText, checked, onChange, id){

    return "";

  function savePlugin(p, fieldNames, secretFlags){
    var existing = p.env || {};
    var envObj = {};
    // Preserve custom/unrendered env entries (such as desktop bridge references).
    Object.keys(existing).forEach(function(k){
      if(fieldNames.indexOf(k) === -1) envObj[k] = existing[k];
    });
    fieldNames.forEach(function(name){
      var inp = document.getElementById("set-" + p.name + "-" + name);
      if(!inp) return;
      var v = (inp.value || "").trim();
      var mode = inp.getAttribute("data-mode") || "direct";
      if(mode === "infisical"){
        if(v){
          envObj[name] = v.indexOf("infisical:") === 0 ? v : ("infisical:" + v);
        }
      } else {
        if(v !== ""){
          envObj[name] = inp.value;
        } else if(secretFlags && secretFlags[name] && existing[name] && !isInfisicalVal(existing[name])){
          envObj[name] = existing[name];
        }
      }
    });
    var patch = { env: envObj };
    var intInp = document.getElementById("int-" + p.name);
    if(intInp && intInp.value !== ""){ var n = parseInt(intInp.value,10); if(!isNaN(n)) patch.interval_s = n; }
    var tokInp = document.getElementById("tok-" + p.name);
    if(tokInp && tokInp.value){ patch.token = tokInp.value; }
    act(api("POST","/api/plugins/"+encodeURIComponent(p.name), patch)).then(function(ok){
      if(!ok) return;
      clearDrafts("set-" + p.name + "-"); clearDrafts("int-" + p.name); clearDrafts("tok-" + p.name);
      fieldNames.forEach(function(name){ delete ui.secretMode[p.name + ":" + name]; });
      render(); toast("Saved " + (p.title||p.name));
    });
  }

  function fmtBytes(n){
    if(n == null || isNaN(n)) return "—";
    if(n < 1024) return n + " B";
    var u = ["KB","MB","GB","TB"], i = -1;
    do{ n = n/1024; i++; } while(n >= 1024 && i < u.length-1);
    return (n >= 10 ? Math.round(n) : Math.round(n*10)/10) + " " + u[i];
  }

  /* ----- chip editor (allowed_plugins) ----- */
  function chipEditor(values, onChange, placeholder, id){
    var box = el("div",{class:"chips",style:"border:1px solid var(--line-2);border-radius:7px;padding:6px;background:var(--panel-2)"});
    values.forEach(function(v){
      box.appendChild(el("span",{class:"chip"}, v,
        el("button",{type:"button","aria-label":"Remove " + v, onclick:function(){
          onChange(values.filter(function(x){ return x !== v; }));
        }}, "×")));
    });
    var inp = el("input",{type:"text",id:id,class:"chip-input",placeholder:placeholder||"add...","aria-label":"Add " + (placeholder||"item"),autocomplete:"off"});
    inp.addEventListener("keydown",function(e){
      if(e.key === "Enter" || e.key === ","){
        e.preventDefault();
        var v = inp.value.trim().replace(/,$/,"");
        if(v && values.indexOf(v) === -1){ onChange(values.concat([v])); }
        inp.value = "";
      } else if(e.key === "Backspace" && !inp.value && values.length){
        onChange(values.slice(0,-1));
      }
    });
    box.appendChild(inp);
    return box;
  }

    root.textContent = "";
    if(!ui.modal){ document.body.style.overflow = ""; return; }
    document.body.style.overflow = "hidden";
    var m = ui.modal;
    var overlay = el("div",{class:"overlay",onclick:function(e){ if(e.target === overlay) closeModal(); }});
    var pre = el("pre",{class:"log"}, m.text);
    var body = el("div",{class:"modal-body"}, pre);
    var modal = el("div",{class:"modal",role:"dialog","aria-modal":"true","aria-label":m.title},
      el("div",{class:"modal-head"},
        el("b",{}, m.title),
        el("button",{class:"btn small",onclick:closeModal,"aria-label":"Close"},"Close")),
      body);
    overlay.appendChild(modal);
    root.appendChild(overlay);
    if(m.scroll){ body.scrollTop = body.scrollHeight; }
    var closeBtn = modal.querySelector("button"); if(closeBtn) closeBtn.focus();
  }
  function closeModal(){ ui.modal = null; render(); }
  document.addEventListener("keydown",function(e){ if(e.key === "Escape" && ui.modal) closeModal(); });

  /* =========================================================
     POLLING
     ========================================================= */
  function tick(){ refreshTimes(); if(isEditingField()) return; refresh(); }
  refresh();
  setInterval(tick, 3000);
})();
</script>
</body>
</html>

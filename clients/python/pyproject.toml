[project]
name = "throughline-client"
version = "0.1.0"
description = "Snowpark-style programmatic Python client and lazy DataFrame query builder for Throughline"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
polars = ["polars>=1.0"]
all = ["pandas>=2.0", "polars>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/throughline_client"]

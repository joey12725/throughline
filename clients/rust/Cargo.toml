[package]
name = "throughline-client"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Snowpark-style programmatic Rust client and lazy DataFrame query builder for Throughline"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

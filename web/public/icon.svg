<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Throughline">
  <!-- Ink field with a warm cast -->
  <rect width="64" height="64" rx="14" fill="#0A0C0F"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none" stroke="#2A3040"/>
  <!-- Hairline lane rules, almost monochrome -->
  <g stroke="#1F2430" stroke-width="1">
    <line x1="12" y1="20" x2="52" y2="20"/>
    <line x1="12" y1="32" x2="52" y2="32"/>
    <line x1="12" y1="44" x2="52" y2="44"/>
  </g>
  <!-- The brass throughline: one continuous thread stitched across the lanes -->
  <path d="M10 46 C 20 46, 22 20, 30 20 S 40 44, 46 44 S 52 22, 56 18"
        fill="none" stroke="#D9A64A" stroke-width="2.75" stroke-linecap="round"/>
  <!-- The 'now' node -->
  <circle cx="56" cy="18" r="3.4" fill="#D9A64A"/>
  <circle cx="56" cy="18" r="6" fill="none" stroke="#D9A64A" stroke-width="1" opacity="0.4"/>
</svg>

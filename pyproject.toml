[project]
name = "throughline"
version = "0.1.0"
description = "Self-hosted personal data hub"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: SQL",
    "Topic :: Database",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Lower bounds are the release lines the test suite runs against (uv.lock).
dependencies = [
    "fastapi>=0.163",
    "uvicorn>=0.54",
    "psycopg[binary,pool]>=3.3.9",
    "typer>=0.29",
    "httpx>=0.28",
    "pydantic>=2.14",
    "pglast>=8.8",
]
[project.optional-dependencies]
images = ["pillow>=13", "pillow-heif>=1.8"]
[project.scripts]
throughline = "throughline.cli:app"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
# The built web interface is git-ignored (web/ builds it into
# src/throughline/web/static) and hatchling leaves git-ignored files out;
# artifacts puts it back into the wheel and the sdist.
[tool.hatch.build]
artifacts = ["src/throughline/web/static/**"]
[dependency-groups]
dev = ["pytest", "pytest-xdist", "openapi-spec-validator", "ruff", "throughline-sdk", "throughline-template", "throughline-client"]
[tool.pytest.ini_options]
testpaths = ["tests", "sdk/tests", "clients/python/tests", "plugins", "fixtures/tests"]
addopts = "--import-mode=importlib"
pythonpath = [".", "tests"]

[tool.uv.workspace]
# Every shipped plugin, listed explicitly (no glob), so a directory that is
# not listed here is never pulled into the workspace or uv.lock. Add a new
# plugin here and to plugins/throughline-plugins.toml.
members = [
    "sdk",
    "clients/python",
    "companion",
    "plugins/activitywatch",
    "plugins/aider",
    "plugins/android-sms",
    "plugins/apple-health",
    "plugins/apple-notes",
    "plugins/audio-transcripts",
    "plugins/beeper",
    "plugins/bluesky",
    "plugins/browser-history",
    "plugins/caldav",
    "plugins/calendar",
    "plugins/capture",
    "plugins/claude-code",
    "plugins/codex",
    "plugins/consumption",
    "plugins/cursor",
    "plugins/email",
    "plugins/gbrain",
    "plugins/github",
    "plugins/goodreads",
    "plugins/google-timeline",
    "plugins/gps-push",
    "plugins/granola",
    "plugins/health",
    "plugins/hermes",
    "plugins/homeassistant",
    "plugins/imap",
    "plugins/imessage",
    "plugins/instagram-feed",
    "plugins/jellyfin",
    "plugins/lastfm",
    "plugins/letterboxd",
    "plugins/listenbrainz",
    "plugins/lmstudio",
    "plugins/markdown-notes",
    "plugins/mastodon",
    "plugins/media",
    "plugins/msgraph",
    "plugins/notion",
    "plugins/openwebui",
    "plugins/plex",
    "plugins/qbittorrent",
    "plugins/readwise",
    "plugins/reddit",
    "plugins/research",
    "plugins/signal",
    "plugins/simplefin",
    "plugins/spotify",
    "plugins/t3code",
    "plugins/telegram",
    "plugins/template",
    "plugins/trakt",
    "plugins/wave",
    "plugins/youtube",
    "plugins/youtube-feed",
    "plugins/zoom",
]
[tool.uv.sources]
throughline-sdk = { workspace = true }
throughline-template = { workspace = true }
throughline-client = { workspace = true }
[tool.ruff]
target-version = "py312"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
